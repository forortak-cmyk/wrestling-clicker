<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wrestling Clicker — Админ</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin:0; padding:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background:#151517; color:#fff; padding: 16px; padding-bottom: 40px; }
  h1 { font-size:18px; margin-bottom: 16px; }
  h2 { font-size:15px; margin-bottom:8px; margin-top: 24px; color:#eee; }
  .stats-grid { display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .stat-card { background:#1c1c1e; border:1px solid #2c2c2e; border-radius:12px; padding:12px; text-align:center; }
  .stat-card .title { font-size:11px; color:#8e8e93; }
  .stat-card .value { font-size:18px; font-weight:bold; margin-top:4px; color:#ffd700; }
  table { width:100%; border-collapse:collapse; font-size:12px; background:#1c1c1e; border-radius:12px; overflow:hidden; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid #2c2c2e; }
  th { color:#8e8e93; font-weight:normal; font-size: 11px; }
  td span.sub { color:#8e8e93; font-size:10px; }
  .loading, .error { text-align:center; color:#8e8e93; margin-top: 60px; font-size: 14px; }
  textarea { width:100%; background:#1c1c1e; border:1px solid #2c2c2e; border-radius:12px; padding:12px; color:#fff; font-size:13px; font-family:inherit; resize:vertical; min-height:90px; }
  .send-btn { width:100%; margin-top:10px; padding:12px; background:#34c759; color:#fff; border:none; border-radius:10px; font-weight:bold; font-size:14px; cursor:pointer; }
  .send-btn:disabled { background:#3a3a3c; color:#8e8e93; cursor:not-allowed; }
  .broadcast-msg { font-size:12px; margin-top:8px; font-weight:bold; }
  tr.gold td { color:#ffd700; font-weight:bold; }
</style>
</head>
<body>
  <h1>📊 Wrestling Clicker — Статистика</h1>
  <div id="content" class="loading">Загрузка данных...</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.ready();

async function load() {
  const contentEl = document.getElementById('content');
  try {
    const res = await fetch('/api/admin-data', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ initData: tg.initData })
    });
    const data = await res.json();

    if (!data.ok) {
      contentEl.className = 'error';
      contentEl.innerText = '⛔ Доступ запрещён';
      return;
    }

    const s = data.stats;

    const sponsorRows = Object.entries(s.perSponsor)
      .sort((a, b) => b[1] - a[1])
      .map(([name, count]) => `<tr><td>${name}</td><td>${count}</td></tr>`)
      .join('');

    const voucherRows = data.vouchers.map(v => `
      <tr>
        <td>${v.username}<br><span class="sub">ID: ${v.telegram_id}</span></td>
        <td>${v.sponsor}</td>
        <td>${v.code}</td>
        <td>${new Date(v.date).toLocaleString('ru-RU')}</td>
      </tr>`).join('');

    const leaderboard = data.leaderboard || [];
    const leaderboardRows = leaderboard.map((l, i) => `
      <tr class="${i === 0 ? 'gold' : ''}">
        <td>${i + 1}</td>
        <td>${l.username}<br><span class="sub">ID: ${l.telegram_id}</span></td>
        <td>${l.referrals}</td>
      </tr>`).join('');

    contentEl.className = '';
    contentEl.innerHTML = `
      <div class="stats-grid">
        <div class="stat-card"><div class="title">Игроков всего</div><div class="value">${s.totalUsers}</div></div>
        <div class="stat-card"><div class="title">Ваучеров куплено</div><div class="value">${s.totalVouchers}</div></div>
        <div class="stat-card"><div class="title">Суммарно заработано</div><div class="value">${s.totalEarned.toLocaleString()} 💰</div></div>
        <div class="stat-card"><div class="title">Суммарный баланс</div><div class="value">${s.totalBalance.toLocaleString()} 💰</div></div>
      </div>

      <h2>🏆 Лидерборд конкурса (по рефералам)</h2>
      <table>
        <thead><tr><th>#</th><th>Игрок</th><th>Рефералов</th></tr></thead>
        <tbody>${leaderboardRows || '<tr><td colspan="3">Пока пусто</td></tr>'}</tbody>
      </table>

      <h2>📢 Рассылка всем игрокам</h2>
      <textarea id="broadcastText" placeholder="Текст сообщения для рассылки..."></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendBroadcast()">Отправить всем (${s.totalUsers})</button>
      <p class="broadcast-msg" id="broadcastMsg"></p>

      <h2>По спонсорам</h2>
      <table>
        <thead><tr><th>Спонсор</th><th>Куплено раз</th></tr></thead>
        <tbody>${sponsorRows || '<tr><td colspan="2">Пока пусто</td></tr>'}</tbody>
      </table>

      <h2>Последние покупки ваучеров</h2>
      <table>
        <thead><tr><th>Игрок</th><th>Спонсор</th><th>Код</th><th>Дата</th></tr></thead>
        <tbody>${voucherRows || '<tr><td colspan="4">Пока пусто</td></tr>'}</tbody>
      </table>
    `;
  } catch (e) {
    contentEl.className = 'error';
    contentEl.innerText = 'Ошибка загрузки данных';
  }
}

async function sendBroadcast() {
  const textEl = document.getElementById('broadcastText');
  const btn = document.getElementById('sendBtn');
  const msgEl = document.getElementById('broadcastMsg');

  const text = textEl.value.trim();
  if (!text) {
    msgEl.style.color = '#ff3b30';
    msgEl.innerText = 'Введите текст сообщения';
    return;
  }

  if (!confirm('Отправить это сообщение всем игрокам? Действие нельзя отменить.')) return;

  btn.disabled = true;
  msgEl.style.color = '#8e8e93';
  msgEl.innerText = 'Отправка... это может занять время';

  try {
    const res = await fetch('/api/broadcast', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData, text })
    });
    const data = await res.json();

    if (!data.ok) {
      msgEl.style.color = '#ff3b30';
      msgEl.innerText = 'Ошибка: ' + (data.error || 'неизвестная');
      btn.disabled = false;
      return;
    }

    msgEl.style.color = '#34c759';
    msgEl.innerText = `Готово: доставлено ${data.sent} из ${data.total} (не удалось: ${data.failed})`;
    textEl.value = '';
    btn.disabled = false;
  } catch (e) {
    msgEl.style.color = '#ff3b30';
    msgEl.innerText = 'Ошибка сети';
    btn.disabled = false;
  }
}

load();
</script>
</body>
</html>
